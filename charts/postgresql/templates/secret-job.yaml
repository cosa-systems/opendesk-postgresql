{{- if .Values.job.enabled }}
---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "{{ include "common.names.fullname" . }}-job"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" . ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" . ) | nindent 4 }}
  {{- end }}
stringData:
  init-wait.sh: |
    RETRIES={{ .Values.job.retries }}
    until psql -c "select 1" > /dev/null 2>&1 || [ $RETRIES -eq "0" ]; do
      echo "Waiting {{ .Values.job.wait }}s for postgres server, $((RETRIES--)) remaining attempts..."
      sleep {{ .Values.job.wait }}
    done
    if [ ${RETRIES} -eq "0" ]; then
      echo "Maximum wait attempts exceeded, aborting".
      exit 1;
    fi
  init-user.sh: |
    {{- range $i, $user := .Values.job.users }}
    echo "Working on {{ tpl $user.username $ }}..."
    {{- if ($user.existingSecret).name }}
    {{- /* The password reaches psql through a variable and is interpolated as a quoted literal
           (:'pw'), so it never appears in this script and needs no escaping. */}}
    {{- $pw := printf "PGPASSWORD_USER_%d" $i }}
    if psql -tc "SELECT 1 FROM pg_user WHERE usename = '{{ tpl $user.username $ }}'" | grep -q 1; then
      echo "User already exists, updating."
      psql -v pw="${{ $pw }}" -c "ALTER USER {{ $user.username | quote }} WITH ENCRYPTED PASSWORD :'pw' CONNECTION LIMIT {{ $user.connectionLimit }}";
    else
      echo "User does not exist, creating."
      psql -v pw="${{ $pw }}" -c "CREATE USER {{ $user.username | quote }} WITH ENCRYPTED PASSWORD :'pw' CONNECTION LIMIT {{ $user.connectionLimit }}";
    fi
    {{- else }}
    if psql -tc "SELECT 1 FROM pg_user WHERE usename = '{{ tpl $user.username $ }}'" | grep -q 1; then
      echo "User already exists, updating."
      psql -c {{ printf "ALTER USER %s WITH ENCRYPTED PASSWORD %s CONNECTION LIMIT %s" ( $user.username | quote ) ( tpl $user.password $ | replace "'" "''" | squote ) ( $user.connectionLimit | toString ) | quote }};
    else
      echo "User does not exist, creating."
      psql -c {{ printf "CREATE USER %s WITH ENCRYPTED PASSWORD %s CONNECTION LIMIT %s" ( $user.username | quote ) ( tpl $user.password $ | replace "'" "''" | squote ) ( $user.connectionLimit | toString ) | quote }};
    fi
    {{- end }}
    {{- end }}
  init-db.sh: |
    {{- range .Values.job.databases }}
    psql -tc "SELECT 1 FROM pg_database WHERE datname = '{{ tpl .name $ }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ tpl .name $ }} {{ with .additionalParams }}{{ . }} {{ end }}";
    psql -c "ALTER DATABASE {{ tpl .name $ }} OWNER TO {{ tpl .user $ }}";
    psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ tpl .name $ }} TO {{ tpl .user $ }}";
    {{- end }}
...
{{- end }}
