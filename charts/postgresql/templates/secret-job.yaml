{{- if .Values.job.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-job
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
stringData:
  init-wait.sh: |
    RETRIES={{ .Values.job.retries }}
    until psql -c "select 1" > /dev/null 2>&1 || [ $RETRIES -eq 0 ]; do
      echo "Waiting {{ .Values.job.wait }}s for postgres server, $((RETRIES--)) remaining attempts..."
      sleep {{ .Values.job.wait }}
    done
  init-user.sh: |
    {{- range .Values.job.users }}
    psql -tc "SELECT 1 FROM pg_user WHERE usename = '{{ .username }}'" | grep -q 1 || psql -c "CREATE USER {{ .username }} WITH ENCRYPTED PASSWORD '{{ .password }}'";
    {{- end }}
  init-db.sh: |
    {{- range .Values.job.databases }}
    psql -tc "SELECT 1 FROM pg_database WHERE datname = '{{ .name }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ .name }}";
    psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ .name }} TO {{ .user }}";
    {{- end }}
...
{{- end }}
