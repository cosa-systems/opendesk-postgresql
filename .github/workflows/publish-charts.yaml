---
# Publish the fork chart packages to ghcr.io/${{ github.repository_owner }} (ghcr.io/cosa-systems).
# The chart version is read from each Chart.yaml: bump the `-cosa.N` counter there + push to
# cosa-deploy = new package. The cloud repo's charts.yaml.gotmpl pins those versions.
name: "Publish helm charts"

on:
  push:
    branches:
      - "cosa-deploy"
    paths:
      - "charts/postgresql/**"
      - ".github/workflows/publish-charts.yaml"
  workflow_dispatch:

permissions:
  contents: "read"
  packages: "write"

jobs:
  publish:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        chart:
          - "postgresql"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
      - name: "Set up Helm"
        uses: "azure/setup-helm@v4"
        with:
          version: "v3.16.4"
      - name: "Log in to ghcr.io"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: "Resolve chart dependencies"
        run: |
          helm dependency update "charts/${{ matrix.chart }}"
      - name: "Package chart"
        run: |
          helm package "charts/${{ matrix.chart }}" --destination dist
      - name: "Push chart"
        run: |
          helm push dist/*.tgz "oci://ghcr.io/${{ github.repository_owner }}"
